name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux
          arch: x64
        - os: macos-latest
          platform: darwin
          arch: arm64
        - os: windows-latest
          platform: win32
          arch: x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
    - uses: holepunchto/actions/bare-base@v1
    - uses: holepunchto/actions/compile-prebuilds@v1
      with:
        platform: ${{ matrix.platform }}
        arch: ${{ matrix.arch }}
        flags: --debug ${{ matrix.flags }}
    - run: bare-make test
